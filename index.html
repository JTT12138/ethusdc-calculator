<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ETHUSDC计算">
<title>ETHUSDC 净风险计算器</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--ok:#067647;--bad:#b42318;--chip:#eef2ff}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#171719;--text:#f5f5f5;--muted:#9ca3af;--line:#34343a;--accent:#60a5fa;--ok:#6ce9a6;--bad:#f97066;--chip:#1f2937}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif}
main{max-width:680px;margin:0 auto;padding:14px 14px 28px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin:0 0 6px}
input,select,button{font:inherit;font-size:16px;min-height:46px;border-radius:12px}input,select{width:100%;border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 12px}
.segment{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.segment button{border:1px solid var(--line);background:transparent;color:var(--text);padding:7px 5px;font-size:13px}
.segment button.active{border-color:var(--accent);background:var(--chip);color:var(--accent);font-weight:700}
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:12px;border:1px solid var(--line);border-radius:14px}.metric .k{font-size:12px;color:var(--muted)}.metric .v{font-size:22px;font-weight:750;margin-top:4px}
.status{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--chip);line-height:1.45}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 12px;min-height:40px;font-size:14px}
.saved,.sub,.hint{color:var(--muted);font-size:12px;line-height:1.5}
@media(max-width:430px){.grid,.result{grid-template-columns:1fr}.segment{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main id="app">
<h1 style="font-size:22px;margin:4px 0">ETHUSDC 净风险计算器</h1>
<div class="sub">自动保存上次输入。即使 iPhone 把 App 从后台清掉，重新打开也会恢复。</div>

<section class="card">
<div class="grid">
<div><label>方向</label><select id="dir"><option>LONG</option><option>SHORT</option></select></div>
<div><label>净风险 USDC</label><input id="risk" type="number" inputmode="decimal" step="0.1" value="3"></div>
<div><label>区间高点</label><input id="high" type="number" inputmode="decimal" step="0.01"></div>
<div><label>区间低点</label><input id="low" type="number" inputmode="decimal" step="0.01"></div>
<div class="full"><label>入场方式</label><div class="segment" id="modes">
<button type="button" data-mode="HIGH_THIRD">高 1/3</button><button type="button" data-mode="MID">1/2</button>
<button type="button" data-mode="LOW_THIRD">低 1/3</button><button type="button" data-mode="FIXED">固定价</button></div></div>
<div id="fixedWrap" style="display:none"><label>固定入场价</label><input id="fixedEntry" type="number" inputmode="decimal" step="0.01"></div>
<div><label>止损来源</label><select id="stopMode"><option value="MANUAL">手动止损</option><option value="RANGE_EDGE">区间边界</option></select></div>
<div id="manualStopWrap"><label>Structural Stop</label><input id="stop" type="number" inputmode="decimal" step="0.01"></div>
<div><label>净目标 R</label><input id="rr" type="number" inputmode="decimal" step="0.1" value="2"></div>
</div>
<div class="toolbar" style="margin-top:12px"><button id="reset" type="button">清空本次价格</button><button id="resetAll" type="button">恢复默认参数</button></div>
<div id="saved" class="saved" style="margin-top:8px">自动保存已开启</div>
</section>

<section class="card">
<div class="result">
<div class="metric"><div class="k">Entry</div><div id="rEntry" class="v">—</div></div>
<div class="metric"><div class="k">Qty</div><div id="rQty" class="v">—</div></div>
<div class="metric"><div class="k">Structural Stop</div><div id="rStop" class="v">—</div></div>
<div class="metric"><div class="k">Net TP</div><div id="rTp" class="v">—</div></div>
</div>
<div id="status" class="status" style="margin-top:10px">输入高点、低点和止损后自动计算。</div>
</section>

<section class="card">
<details><summary>高级参数</summary>
<div class="grid" style="margin-top:12px">
<div><label>Stop Slippage bps</label><input id="slip" type="number" inputmode="decimal" step="0.000001" value="8.725691"></div>
<div><label>Qty Step</label><input id="qtyStep" type="number" inputmode="decimal" step="0.001" value="0.001"></div>
<div><label>Price Tick</label><input id="tick" type="number" inputmode="decimal" step="0.01" value="0.01"></div>
</div></details>
</section>

<section class="card hint">Entry 手续费 0%；TP 手续费 0%；Stop Taker 手续费 0.04%。页面和输入都缓存到本机。</section>
</main>

<script>
(()=>{
const root=document.getElementById('app'); if(root.dataset.ready)return; root.dataset.ready='1';
const KEY='ethusdc-net-risk-state-v2',$=id=>document.getElementById(id);
const ids=['dir','risk','high','low','fixedEntry','stopMode','stop','rr','slip','qtyStep','tick'];
let mode='MID',timer=null;
const buttons=[...document.querySelectorAll('#modes button')];
const setUI=()=>{buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('fixedWrap').style.display=mode==='FIXED'?'':'none';$('manualStopWrap').style.display=$('stopMode').value==='MANUAL'?'':'none'};
const restore=()=>{try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){ids.forEach(id=>{if(s[id]!==undefined)$(id).value=s[id]});if(['HIGH_THIRD','MID','LOW_THIRD','FIXED'].includes(s.mode))mode=s.mode}}catch{} setUI()};
const save=()=>{clearTimeout(timer);timer=setTimeout(()=>{try{const s={mode};ids.forEach(id=>s[id]=$(id).value);localStorage.setItem(KEY,JSON.stringify(s));$('saved').textContent='已自动保存 · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch{$('saved').textContent='自动保存失败'}},80)};
const num=id=>{const v=Number($(id).value);return Number.isFinite(v)?v:NaN};
const floor=(v,s)=>Math.floor((v+1e-12)/s)*s,ceil=(v,s)=>Math.ceil((v-1e-12)/s)*s,f=(v,d=8)=>Number.isFinite(v)?Number(v.toFixed(d)).toString():'—';
function calc(){
 const H=num('high'),L=num('low'),risk=num('risk'),rr=num('rr'),slip=num('slip'),qs=num('qtyStep'),tick=num('tick'),isLong=$('dir').value==='LONG';
 const range=H-L,h3=range>0?L+range*2/3:NaN,mid=range>0?L+range/2:NaN,l3=range>0?L+range/3:NaN;
 const entry=mode==='HIGH_THIRD'?h3:mode==='MID'?mid:mode==='LOW_THIRD'?l3:num('fixedEntry');
 const stop=$('stopMode').value==='RANGE_EDGE'?(isLong?L:H):num('stop');
 let qty=NaN,tp=NaN,net=NaN,profit=NaN;
 if(Number.isFinite(entry)&&Number.isFinite(stop)&&risk>0&&rr>0&&slip>=0&&qs>0&&tick>0&&(isLong?stop<entry:stop>entry)){
   const esf=isLong?stop*(1-slip/10000):stop*(1+slip/10000);
   const unit=Math.abs(entry-esf)+esf*0.0004; qty=floor(risk/unit,qs);
   if(qty>0){net=qty*unit;const raw=isLong?entry+risk*rr/qty:entry-risk*rr/qty;tp=isLong?ceil(raw,tick):floor(raw,tick);profit=qty*Math.abs(tp-entry)}
 }
 $('rEntry').textContent=f(entry);$('rQty').textContent=f(qty);$('rStop').textContent=f(stop);$('rTp').textContent=f(tp);
 const st=$('status');
 if(!(H>L)){st.className='status bad';st.textContent='请输入有效高低点，High > Low。'}
 else if(!(Number.isFinite(entry)&&Number.isFinite(stop)&&(isLong?stop<entry:stop>entry))){st.className='status bad';st.textContent=isLong?'LONG 必须满足 Stop < Entry。':'SHORT 必须满足 Stop > Entry。'}
 else{st.className='status ok';st.textContent='READY｜预计净止损 '+f(net,6)+' USDC｜预计净止盈 '+f(profit,6)+' USDC'}
}
buttons.forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;setUI();calc();save()}));
root.addEventListener('input',e=>{if(e.target.matches('input,select')){calc();save()}});
root.addEventListener('change',e=>{if(e.target.matches('input,select')){setUI();calc();save()}});
$('reset').addEventListener('click',()=>{$('high').value='';$('low').value='';$('fixedEntry').value='';$('stop').value='';calc();save()});
$('resetAll').addEventListener('click',()=>{$('dir').value='LONG';$('risk').value='3';$('high').value='';$('low').value='';$('fixedEntry').value='';$('stopMode').value='MANUAL';$('stop').value='';$('rr').value='2';$('slip').value='8.725691';$('qtyStep').value='0.001';$('tick').value='0.01';mode='MID';setUI();calc();save()});
restore();calc();window.addEventListener('pageshow',()=>{restore();calc()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
